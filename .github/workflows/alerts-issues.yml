# Phone alert (ntfy) for new issues and PRs on this repo, and (on a short schedule)
# for new issues and PRs on tradingaihub/awesome-finance-ai-tools.
# Repo secret: NTFY_TOPIC (never echoed). Titles and URLs are untrusted input: they
# only reach curl through env vars and a file, never through ${{ }} interpolation.
name: alerts-issues
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  notify-site:
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title || github.event.pull_request.title }}
          ISSUE_URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
          ISSUE_USER: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [ -n "$NTFY_TOPIC" ] || { echo "NTFY_TOPIC missing"; exit 1; }
          title_hdr="New issue"
          tags="inbox"
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            title_hdr="New pull request"
            tags="mailbox_with_mail"
          elif printf '%s' "$ISSUE_TITLE" | grep -q '^\[Submit\]'; then
            title_hdr="New tool submission"
            tags="toolbox"
          fi
          name="$(printf '%s' "$ISSUE_TITLE" | tr -d '\r\n' | cut -c1-120)"
          user="$(printf '%s' "$ISSUE_USER" | tr -d '\r\n')"
          url="$(printf '%s' "$ISSUE_URL" | tr -d '\r\n')"
          printf '%s\nby @%s\n%s\n' "$name" "$user" "$url" > msg.txt
          code=$(curl -sS --max-time 20 --retry 2 -o /dev/null -w '%{http_code}' \
            -H "Title: $title_hdr" -H "Tags: $tags" -H "Priority: 3" -H "Click: $url" \
            --data-binary @msg.txt "https://ntfy.sh/$NTFY_TOPIC")
          echo "ntfy http $code"
          [ "$code" = 200 ]

  poll-awesome:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Notify new awesome-list issues and PRs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          [ -n "$NTFY_TOPIC" ] || { echo "NTFY_TOPIC missing"; exit 1; }
          # 20-minute lookback for a ~15-minute schedule, so a late runner does not miss an item.
          since=$(date -u -d '20 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')
          curl -fsS --max-time 30 --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: tradingaihub-alerts" \
            "https://api.github.com/repos/tradingaihub/awesome-finance-ai-tools/issues?state=all&sort=created&direction=desc&per_page=50" \
            -o items.json
          jq -c --arg since "$since" '.[] | select(.created_at >= $since)' items.json > new.jsonl || true
          [ -s new.jsonl ] || { echo "no new awesome items"; exit 0; }
          while IFS= read -r row; do
            url=$(printf '%s' "$row" | jq -r .html_url | tr -d '\r\n')
            user=$(printf '%s' "$row" | jq -r .user.login | tr -d '\r\n')
            raw_title=$(printf '%s' "$row" | jq -r .title)
            is_pr=$(printf '%s' "$row" | jq -r 'has("pull_request")')
            name="$(printf '%s' "$raw_title" | tr -d '\r\n' | cut -c1-120)"
            if [ "$is_pr" = "true" ]; then
              hdr="New awesome-list PR"
              tags="mailbox_with_mail"
            elif printf '%s' "$raw_title" | grep -q '^\[Submit\]'; then
              hdr="New awesome-list submission"
              tags="toolbox"
            else
              hdr="New awesome-list issue"
              tags="inbox"
            fi
            printf '%s\nby @%s\n%s\n' "$name" "$user" "$url" > msg.txt
            code=$(curl -sS --max-time 20 --retry 2 -o /dev/null -w '%{http_code}' \
              -H "Title: $hdr" -H "Tags: $tags" -H "Priority: 3" -H "Click: $url" \
              --data-binary @msg.txt "https://ntfy.sh/$NTFY_TOPIC")
            echo "ntfy http $code"
            [ "$code" = 200 ]
          done < new.jsonl
