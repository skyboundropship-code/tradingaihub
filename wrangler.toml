# Cloudflare Pages config (static + functions/). Deploy from repo root:
#   npm run build && npx wrangler pages deploy dist --project-name=tradingaihub
name = "tradingaihub"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Newsletter signups (functions/api/subscribe.js) use a Workers KV namespace bound as NEWSLETTER.
# The project is Direct Upload: `wrangler pages deploy` reads this file, and this file is the source of truth for bindings.
# Top-level = production (main branch). [env.preview] = every other branch, with a separate namespace so test signups
# never mix with the real list. Without the binding, /api/subscribe returns 503 "not_configured".
# The rate-limit IP-hash salt is the secret RL_SALT (never in this file): set with
#   npx wrangler pages secret put RL_SALT --project-name tradingaihub [--env preview]
# Without it, /api/subscribe refuses writes with 503 {"ok":false,"error":"server"}.
# Anonymous outbound-click counters (functions/api/click.js) reuse the same NEWSLETTER namespace under the click: and crl:
# key prefixes (no personal data; see the privacy page). Read them with `npm run clicks` (needs your wrangler login).
[[kv_namespaces]]
binding = "NEWSLETTER"
id = "a9f8a42d1ec641c8abe07640adb8241e"        # tradingaihub-newsletter

[env.preview]
[[env.preview.kv_namespaces]]
binding = "NEWSLETTER"
id = "9e02466fee564ed89729982776b46919"        # tradingaihub-newsletter-preview

# Phone alerts (functions/_lib/notify.js): secret NTFY_TOPIC (production + preview), optional NTFY_SERVER / NTFY_TOKEN.
# /api/polar-webhook: secret POLAR_WEBHOOK_SECRET (production = Polar endpoint secret, preview = a separate TEST secret).
# /api/alerts/summary: secret ALERTS_TOKEN (also a GitHub repo secret, used by .github/workflows/alerts-daily.yml).
# Every preview alert title starts with "[TEST] " so it can never be mistaken for a real event.
[env.preview.vars]
NTFY_TITLE_PREFIX = "[TEST] "
