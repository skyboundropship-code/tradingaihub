# Cloudflare Pages config (static + functions/). Deploy from repo root:
#   npm run build && npx wrangler pages deploy dist --project-name=tradingaihub
name = "tradingaihub"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Newsletter signups (functions/api/subscribe.js) use a Workers KV namespace bound as NEWSLETTER.
# The project is Direct Upload: `wrangler pages deploy` reads this file, and this file is the source of truth for bindings.
# Top-level = production (main branch). [env.preview] = every other branch, with a separate namespace so test signups
# never mix with the real list. Without the binding, /api/subscribe returns 503 "not_configured".
[[kv_namespaces]]
binding = "NEWSLETTER"
id = "a9f8a42d1ec641c8abe07640adb8241e"        # tradingaihub-newsletter

[env.preview]
[[env.preview.kv_namespaces]]
binding = "NEWSLETTER"
id = "9e02466fee564ed89729982776b46919"        # tradingaihub-newsletter-preview
